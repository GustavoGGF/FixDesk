services:
  mysql:
    image: mysql:8.0
    container_name: fixdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no ambiente ou em um arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fixdesk_database}
      MYSQL_USER: ${MYSQL_USER:-fixdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no ambiente ou em um arquivo .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - fixdesk-network

  backend:
    build:
      context: ..
      # O Dockerfile fica em backend/, mas o contexto precisa incluir também
      # o código-fonte do frontend para compilar a SPA.
      dockerfile: backend/Dockerfile
    container_name: fixdesk-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      USER_DB: ${MYSQL_USER:-fixdesk}
      USER_PWD_DB: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no ambiente ou em um arquivo .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-fixdesk_database}
      DB_POOL_ENABLED: "true"
      DB_POOL_MIN: "2"
      DB_POOL_MAX: "5"
      DB_POOL_MAX_OVERFLOW: "10"
      DB_POOL_IDLE_TIME: "3600"
      DB_POOL_RECYCLE: "3600"
      DB_POOL_PRE_PING: "true"
      DB_POOL_ECHO: "false"
      DB_POOL_HEALTH_CHECK_INTERVAL: "300"
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no ambiente ou em um arquivo .env}
      DEBUG: ${DEBUG:-false}
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn fixdesk.wsgi:application
        --bind 0.0.0.0:8000
        --workers 4
        --threads 2
        --timeout 120
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - fixdesk-network

volumes:
  mysql-data:
    driver: local

networks:
  fixdesk-network:
    driver: bridge
